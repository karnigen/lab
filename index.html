<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Lab applications</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 48px auto;
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); }
    p { line-height: 1.55; }

    .intro, .app-card {
      padding: 24px;
      border: 1px solid #e0e5ef;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 14px #1720330a;
    }

    .intro { margin-bottom: 18px; }
    .intro p { margin: 0; color: #536078; }
    .app-card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .app-card p { margin: 0 0 18px; color: #536078; }
    .app-link {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid #244ec9;
      border-radius: 8px;
      background: #244ec9;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
    }
    .app-link:hover { border-color: #193ca6; background: #193ca6; }
    .app-link:focus-visible { outline: 3px solid #8da7ff80; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>Lab applications</h1>
      <p>A collection of small applications and experiments.</p>
    </header>

    <section class="app-card" aria-labelledby="ai-offpeak-title">
      <h2 id="ai-offpeak-title">AI Off-Peak Schedule</h2>
      <p>View fixed off-peak and peak pricing hours for DeepSeek and Ollama.</p>
      <a class="app-link" href="ai-offpeak/">Open application</a>
    </section>
  </main>
</body>
</html>
